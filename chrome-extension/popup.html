<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>fxproxy 凭证提取</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; width: 360px; margin: 0; padding: 16px; color: #222; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { font-size: 12px; color: #666; margin-bottom: 12px; }
  button { width: 100%; padding: 9px; font-size: 13px; border: 0; border-radius: 6px;
           background: #0060df; color: #fff; cursor: pointer; }
  button:disabled { background: #aaa; cursor: default; }
  button.ghost { background: #eef0f3; color: #222; margin-top: 6px; }
  select { width: 100%; padding: 7px; font-size: 13px; box-sizing: border-box; }
  label { display:block; font-size:12px; color:#555; margin-bottom:4px; }
  textarea { width: 100%; height: 110px; box-sizing: border-box; margin-top: 8px;
             font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  #msg { font-size: 12px; min-height: 16px; margin-top: 8px; word-break: break-all; line-height: 1.5; }
  .ok { color: #0a7d28; } .err { color: #c00; }
  ol { padding-left: 18px; font-size: 12px; color: #444; line-height: 1.6; margin: 0 0 12px; }
  .hint { font-size: 11px; color: #777; margin-top: 6px; line-height: 1.5; }
</style>
</head>
<body>
  <h1>fxproxy 凭证提取 <span id="ver" style="font-size:11px;color:#999;font-weight:400;"></span></h1>
  <div class="sub">在已登录的 Firefox 账号页一键提取</div>

  <ol>
    <li>在住宅 IP 的 Chrome 打开 <b>accounts.firefox.com</b> 并登录</li>
    <li>下面选一项，点「提取并复制」</li>
    <li>面板「添加账号」的方式选<b>同一项</b>，粘贴，点添加</li>
  </ol>

  <label for="format">导出格式</label>
  <select id="format">
    <option value="session">sessionToken（默认，每行一个）</option>
    <option value="email">邮箱（面板还需填密码）</option>
  </select>

  <button id="extract" style="margin-top:10px;">提取并复制凭证</button>
  <div id="msg"></div>
  <textarea id="out" readonly placeholder="提取结果会显示在这里"></textarea>
  <div class="hint" id="tip">sessionToken 粘到面板「Cookie / 插件导出」或「sessionToken」任一项都能识别。refresh_token 只能在面板里由 sessionToken 换出，插件无法生成。</div>

  <script src="formats.js"></script>
  <script src="popup.js"></script>
</body>
</html>
